    background: radial-gradient(120% 90% at 50% 40%, var(--brand) 0%, var(--brand-deep) 100%);
    display: grid; place-items: center; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;

  .stage { display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 0 24px; }

  .name { font-weight: 600; letter-spacing: .42em; font-size: clamp(14px, 3.6vw, 18px); text-indent: .42em; opacity: 0; animation: rise .7s ease-out .9s both; }

  /* Progress bar echoing the swoosh under the logo */
  .bar { width: min(52vw, 220px); height: 4px; border-radius: 4px; background: rgba(255,255,255,.22); overflow: hidden; opacity: 0; animation: rise .5s ease-out 1.1s both; }
  .bar i { display: block; height: 100%; width: 40%; border-radius: 4px; background: #fff; animation: slide 1.3s ease-in-out 1.1s infinite; }

  @keyframes wipe  { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes pop   { from { opacity: 0; transform: translateX(-24px) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes shine { 0% { background-position: 150% 0; } 55%,100% { background-position: -150% 0; } }
  @keyframes rise  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
  .replay { position: fixed; bottom: 16px; right: 16px; font: 13px system-ui; color: #fff; background: rgba(255,255,255,.16); border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
</style>
